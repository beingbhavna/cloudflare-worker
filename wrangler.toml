name = "vss-enterprise-api"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# ─── D1 Database ──────────────────────────────────────────────────────────────
# After running: wrangler d1 create vss-enterprise-db
# Copy the database_id from the output and paste it below
[[d1_databases]]
binding = "DB"
database_name = "vss-enterprise-db"
database_id   = "REPLACE_AFTER_RUNNING_wrangler_d1_create"

# ─── Environment Variables ────────────────────────────────────────────────────
# Non-secret vars go here. Secrets use: wrangler secret put SECRET_NAME
[vars]
ADMIN_EMAIL   = "vss.electricsenterprises@gmail.com"
FRONTEND_URL  = "http://localhost:4200"

# ─── Secrets (set via CLI, never put in this file) ───────────────────────────
# wrangler secret put RESEND_API_KEY
# wrangler secret put ADMIN_PASSWORD
# wrangler secret put JWT_SECRET
